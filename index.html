<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>졸업요건 정리 · 디자인경영전공</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <div>
        <h1>졸업요건 정리</h1>
        <p class="sub">홍익대 디자인·예술경영학부 · 디자인경영전공</p>
      </div>
      <div class="auth-box" id="authBox">
        <!-- 로그인 상태에 따라 auth.js가 채웁니다 -->
      </div>
    </div>
  </header>

  <main class="wrap">
    <!-- 전체 진행률 -->
    <section class="overview">
      <div class="overview-head">
        <h2>전체 이수 현황</h2>
        <span id="totalSummary" class="chip">0 / 132 학점</span>
      </div>
      <div class="progress-bar">
        <div id="totalProgress" class="progress-fill"></div>
      </div>
      <p class="overview-note">졸업 기준 <b>총 132학점</b> · 전공 50학점(전공필수 전부 포함) · 교양은 최대 50학점까지만 인정</p>
    </section>

    <!-- 학년 필터 -->
    <section class="filter-bar">
      <span class="filter-label">학년별 보기</span>
      <div class="filter-chips" id="yearFilter">
        <button class="fchip active" data-year="all">전체</button>
        <button class="fchip" data-year="1">1학년</button>
        <button class="fchip" data-year="2">2학년</button>
        <button class="fchip" data-year="3">3학년</button>
        <button class="fchip" data-year="4">4학년</button>
      </div>
    </section>

    <!-- 카테고리별 요건 -->
    <section>
      <div class="section-head">
        <h2>영역별 요건</h2>
        <button id="addCategoryBtn" class="btn small">+ 영역 추가</button>
      </div>
      <div id="categories" class="categories"></div>
    </section>

    <!-- 바로가기 -->
    <section class="links">
      <h2>바로가기</h2>
      <ul>
        <li><a href="https://cn.hongik.ac.kr/app/timetable/" target="_blank" rel="noopener">
          강의시간표 · 수강신청 <span class="desc">개설 과목/시간 확인</span><span class="arrow">↗</span></a></li>
        <li><a href="https://www.hongik.ac.kr/kr/education/cyber-lecture.do" target="_blank" rel="noopener">
          사이버강의 안내 <span class="desc">특성화교양(컴퓨팅사고 등)</span><span class="arrow">↗</span></a></li>
        <li><a href="https://iim.hongik.ac.kr/iim/0401.do?mode=view&articleNo=153752" target="_blank" rel="noopener">
          졸업논문 공지 <span class="desc">디자인·예술경영학부</span><span class="arrow">↗</span></a></li>
      </ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>자료 출처: 2026 교과과정책자(안) 및 학과 공지. 실제 수강신청·졸업 처리 전 학과 공지를 반드시 확인하세요.</p>
      <button id="resetBtn" class="btn small">처음 상태로 초기화</button>
    </div>
  </footer>

  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script type="module" src="auth.js"></script>
</body>
</html>
