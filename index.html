<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>졸업요건 정리 · 홍익대</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1>🎓 졸업요건 정리</h1>
      <p class="sub">내가 뭘 들어야 졸업할 수 있는지 한눈에 보기</p>
    </div>
  </header>

  <main class="wrap">
    <!-- 전체 진행률 -->
    <section class="overview">
      <div class="overview-head">
        <h2>전체 이수 현황</h2>
        <span id="totalSummary" class="chip">0 / 0 학점</span>
      </div>
      <div class="progress-bar">
        <div id="totalProgress" class="progress-fill"></div>
      </div>
    </section>

    <!-- 카테고리별 요건 -->
    <section>
      <div class="section-head">
        <h2>영역별 요건</h2>
        <button id="addCategoryBtn" class="btn ghost">+ 영역 추가</button>
      </div>
      <div id="categories" class="categories"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>기록은 이 브라우저에 자동 저장돼요. GitHub에 올려두면 어느 기기에서든 이어서 볼 수 있어요.</p>
      <button id="resetBtn" class="btn ghost small">기록 초기화</button>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
