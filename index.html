<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>졸업요건 대시보드 · 디자인경영전공</title>
  <link rel="stylesheet" href="style.css?v=6" />
</head>
<body>
  <!-- ① 헤더 배너 -->
  <header class="site-header">
    <div class="wrap dash-header">
      <div class="dash-left">
        <div class="donut-wrap">
          <svg viewBox="0 0 120 120" class="donut">
            <circle class="donut-track" cx="60" cy="60" r="52" />
            <circle class="donut-fill" id="donutFill" cx="60" cy="60" r="52" />
          </svg>
          <div class="donut-center">
            <span class="donut-pct" id="donutPct">0%</span>
            <span class="donut-sub" id="donutSub">0 / 132</span>
          </div>
        </div>
        <div class="title-block">
          <div class="dept-label">홍익대 디자인·예술경영학부 · 디자인경영전공</div>
          <h1>졸업요건 대시보드</h1>
          <div class="remaining">졸업까지 <b id="remainTotal">132학점</b> 남음</div>
        </div>
      </div>
      <div class="dash-right">
        <div class="auth-box" id="authBox"></div>
        <button id="resetBtn" class="btn small">초기화</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <!-- ② 영역별 요건 카드 -->
    <section class="area-grid" id="areaGrid"></section>

    <!-- 사이버강의 이수 한도 -->
    <div class="cyber-bar" id="cyberBar"></div>

    <!-- ③ 과목 추가 폼 -->
    <section class="add-form">
      <select id="fSemester" aria-label="학기"></select>
      <select id="fArea" aria-label="영역"></select>
      <div class="combo">
        <input id="fName" placeholder="과목명 검색 (예: 마케팅)" autocomplete="off" />
        <div class="combo-list" id="comboList" hidden></div>
      </div>
      <select id="fCredits" aria-label="학점">
        <option value="1">1학점</option>
        <option value="2">2학점</option>
        <option value="3" selected>3학점</option>
      </select>
      <button id="addBtn" class="btn accent">+ 과목 추가</button>
    </section>

    <!-- ④ 학기 로드맵 -->
    <section>
      <div class="section-head"><h2>학기 로드맵</h2></div>
      <div class="roadmap" id="roadmap"></div>
    </section>

    <!-- 저장 CTA -->
    <section class="save-bar" id="saveBar"></section>

    <!-- 바로가기 -->
    <section class="links">
      <h2>바로가기</h2>
      <ul>
        <li><a href="https://cn.hongik.ac.kr/app/timetable/" target="_blank" rel="noopener">
          강의시간표 · 수강신청 <span class="desc">개설 과목/시간 확인</span><span class="arrow">↗</span></a></li>
        <li><a href="https://www.hongik.ac.kr/kr/education/cyber-lecture.do" target="_blank" rel="noopener">
          사이버강의 안내 <span class="desc">특성화교양(컴퓨팅사고 등)</span><span class="arrow">↗</span></a></li>
        <li><a href="https://iim.hongik.ac.kr/iim/0401.do?mode=view&articleNo=153752" target="_blank" rel="noopener">
          졸업논문 공지 <span class="desc">디자인·예술경영학부</span><span class="arrow">↗</span></a></li>
      </ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>졸업 기준 총 132학점 · 전공 50학점(전공필수 전부 포함) · 교양은 최대 50학점까지만 인정. 자료 출처: 2026 교과과정책자(안). 실제 수강신청·졸업 처리 전 학과 공지를 꼭 확인하세요.</p>
    </div>
  </footer>

  <script src="firebase-config.js?v=6"></script>
  <script src="app.js?v=6"></script>
  <script type="module" src="auth.js?v=6"></script>
</body>
</html>
